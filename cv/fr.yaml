        décisions d'architecture et mentorat, en restant au contact du code. Sait
        aussi intégrer des fonctionnalités **IA/LLM** (agents, RAG, MCP) dans de
        vrais produits métier. Ouvert à un **CDI** ou à une **mission freelance
        longue** en Senior/Lead Backend, full remote, France ou Europe."

    "Compétences":
      - label: Backend
