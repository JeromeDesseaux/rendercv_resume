      - bullet: "**Devolis** (oct. 2016 – août 2017) & **Invoke** (janv. 2016 – oct. 2016)
          — Applications web et facturation en C#/.NET (ASP.NET, Entity Framework,
          SQL Server) avec frontends Angular, Rouen."

